/* ============================================================
   Pixel UI. Everything is squared off: no border-radius,
   3px notched corners via clip-path (.px), bevels via inset
   box-shadows, and a single pixel typeface (Fusion Pixel 12px,
   with Noto Kufi Arabic covering the Arabic script).
   ============================================================ */
:root {
  --bg: #0f1115;
  --panel: #171a21;
  --panel-2: #1d2129;
  --line: #2a2f39;
  --line-hi: #3c434f;
  --text: #d7dbe3;
  --muted: #8a92a0;
  --accent: #e8792b;
  --accent-2: #ffb347;
  --green: #5cff7a;
  --green-d: #1f3a26;
  --danger: #c43c3c;
  --pad: #232833;
  --pad-hi: #2f3642;
  --bevel-l: rgba(255,255,255,0.09);
  --bevel-d: rgba(0,0,0,0.5);
  --px: 'FP-SC', 'Noto Kufi Arabic', 'Courier New', monospace;
  --notch: 3px;
}
html[lang="ja"] { --px: 'FP-JP', 'Noto Kufi Arabic', 'Courier New', monospace; }
html[lang="ko"] { --px: 'FP-KR', 'Noto Kufi Arabic', 'Courier New', monospace; }
html[lang="ar"] { --px: 'FP-SC', 'Noto Kufi Arabic', sans-serif; }

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  background-image:
    linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--text);
  font-family: var(--px);
  font-size: 12px;
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: none;
  font-smooth: never;
  text-rendering: optimizeSpeed;
}
/* faint CRT scanlines */
body::after {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 50;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,0.12) 0 1px, transparent 1px 3px);
}
h1, h2, p { margin: 0; }
h1 { font-size: 24px; line-height: 1.2; color: var(--accent-2); font-weight: 400; text-wrap: balance; }
h2 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 400; }
button, select, input { font-family: inherit; font-size: 12px; color: var(--text); }
button { cursor: pointer; }
small { font-size: 12px; }

/* ---------- pixel primitives ---------- */
.px {
  border-radius: 0;
  clip-path: polygon(var(--notch) 0, calc(100% - var(--notch)) 0, 100% var(--notch), 100% calc(100% - var(--notch)),
                     calc(100% - var(--notch)) 100%, var(--notch) 100%, 0 calc(100% - var(--notch)), 0 var(--notch));
}
.bevel, .btn, .pad, .loop, .panel, .canvas-wrap, select.px, input[type=number].px, .toast, .wav {
  box-shadow: inset 2px 2px 0 var(--bevel-l), inset -2px -2px 0 var(--bevel-d);
}
:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--accent-2) !important; }

/* ---------- sliders ---------- */
input[type=range] {
  -webkit-appearance: none; appearance: none; width: 110px; height: 18px; background: transparent;
  vertical-align: middle; margin: 0; padding: 0;
}
input[type=range]::-webkit-slider-runnable-track {
  height: 10px; background: var(--panel-2);
  background-image: repeating-linear-gradient(90deg, var(--line) 0 2px, transparent 2px 10px);
  box-shadow: inset 2px 2px 0 var(--bevel-d), inset -2px -2px 0 var(--bevel-l);
}
input[type=range]::-moz-range-track {
  height: 10px; background: var(--panel-2);
  background-image: repeating-linear-gradient(90deg, var(--line) 0 2px, transparent 2px 10px);
  box-shadow: inset 2px 2px 0 var(--bevel-d), inset -2px -2px 0 var(--bevel-l);
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 14px; height: 18px; margin-top: -4px; border: 0; border-radius: 0;
  background: var(--accent);
  box-shadow: inset 2px 2px 0 rgba(255,255,255,0.35), inset -2px -2px 0 rgba(0,0,0,0.45);
  clip-path: polygon(2px 0, calc(100% - 2px) 0, 100% 2px, 100% calc(100% - 2px), calc(100% - 2px) 100%, 2px 100%, 0 calc(100% - 2px), 0 2px);
}
input[type=range]::-moz-range-thumb {
  width: 14px; height: 18px; border: 0; border-radius: 0; background: var(--accent);
  box-shadow: inset 2px 2px 0 rgba(255,255,255,0.35), inset -2px -2px 0 rgba(0,0,0,0.45);
}
input[type=number].px, select.px {
  background: var(--panel-2); border: 0; padding: 6px 8px; height: 30px;
  -webkit-appearance: none; appearance: none;
}
select.px {
  padding-inline-end: 22px;
  background-image: linear-gradient(45deg, transparent 50%, var(--accent-2) 50%), linear-gradient(135deg, var(--accent-2) 50%, transparent 50%);
  background-position: calc(100% - 12px) 12px, calc(100% - 8px) 12px;
  background-size: 4px 4px, 4px 4px; background-repeat: no-repeat;
}
html[dir="rtl"] select.px { background-position: 12px 12px, 8px 12px; }
input[type=number].px { width: 60px; -moz-appearance: textfield; }
input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }

/* ---------- buttons ---------- */
.btn {
  background: var(--pad); border: 0; padding: 8px 12px; line-height: 1.2;
  transition: background 0.1s;
}
.btn:hover { background: var(--pad-hi); }
.btn:active, .btn.down { box-shadow: inset 2px 2px 0 var(--bevel-d), inset -2px -2px 0 var(--bevel-l); transform: translateY(1px); }
.btn.accent { background: var(--accent); color: #14100c; }
.btn.accent:hover { background: var(--accent-2); }
.btn.danger { background: #3a1c1c; color: #f0b0b0; }
.btn.danger:hover { background: #4a2424; }
.btn.big { font-size: 16px; padding: 16px 22px; }
.btn.on { background: var(--green-d); color: var(--green); }
.btn.rec-btn { min-width: 96px; }
.btn.rec-btn.rec { background: #5a1e1e; color: #ffd0d0; animation: blink 1s steps(2, end) infinite; }
@keyframes blink { 50% { background: #8a2a2a; } }

/* ---------- top bar ---------- */
.topbar {
  display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between;
  padding: 14px 20px; border-bottom: 3px solid var(--line);
  background: linear-gradient(180deg, #1a1e26, #12151b);
}
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.brand-mark {
  font-size: 30px; color: var(--accent); width: 46px; height: 46px; flex: none; display: grid; place-items: center;
  background: var(--panel-2); box-shadow: inset 2px 2px 0 var(--bevel-l), inset -2px -2px 0 var(--bevel-d);
  animation: spin 9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .brand-mark, .btn.rec-btn.rec { animation: none; } }
.topbar .sub { margin-top: 2px; color: var(--muted); font-size: 12px; letter-spacing: 0.04em; }
.master { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; color: var(--muted); }
.master label { display: flex; align-items: center; gap: 8px; }
.lang-wrap select { min-width: 110px; }

/* ---------- layout ---------- */
.layout {
  display: grid; gap: 18px; padding-block: 18px 8px; padding-inline: 20px;
  grid-template-columns: minmax(300px, 1fr) minmax(320px, 1.2fr);
  grid-template-areas: "machine pads" "seq seq";
  max-width: 1240px; margin: 0 auto;
}
.machine-panel { grid-area: machine; }
.pads-panel { grid-area: pads; }
.seq-panel { grid-area: seq; }
.panel { min-width: 0; background: var(--panel); padding: 14px; }
.panel-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.hint { color: var(--muted); font-size: 12px; }

/* ---------- canvas ---------- */
.canvas-wrap { position: relative; background: #171a21; padding: 3px; display: grid; place-items: center; }
#pixel {
  display: block; width: 100%; max-width: 100%; height: auto;
  image-rendering: pixelated; image-rendering: crisp-edges; cursor: crosshair;
}
.overlay {
  position: absolute; inset: 3px; display: grid; place-items: center; align-content: center; gap: 10px;
  background: rgba(10,11,14,0.8); text-align: center; color: var(--muted); padding: 12px;
}
.overlay.hidden { display: none; }

/* ---------- pads ---------- */
.pads { display: grid; grid-template-columns: repeat(auto-fill, minmax(136px, 1fr)); gap: 10px; }
.pad {
  position: relative; display: flex; flex-direction: column; gap: 4px; padding: 12px 12px 10px;
  background: var(--pad); user-select: none; -webkit-user-select: none; touch-action: manipulation;
  cursor: pointer; min-height: 96px;
}
.pad:hover { background: var(--pad-hi); }
.pad.hit { background: var(--pad-hi); box-shadow: inset 0 0 0 3px var(--pad-color, var(--accent)); }
.pad .name { font-size: 16px; line-height: 1.25; padding-inline-end: 22px; overflow-wrap: anywhere; }
.pad .sub { color: var(--muted); letter-spacing: 0.04em; overflow-wrap: anywhere; }
.pad .key {
  position: absolute; top: 8px; inset-inline-end: 8px; color: #0f1115; line-height: 1;
  background: var(--pad-color, var(--accent)); padding: 4px 5px;
}
.pad .bar { height: 3px; background: var(--pad-color, var(--accent)); width: 34px; }
.wav {
  align-self: flex-start; margin-top: auto; background: var(--panel-2); border: 0; color: var(--muted);
  padding: 4px 8px; line-height: 1.2;
}
.wav:hover { color: var(--text); background: var(--line); }
.wav.busy { opacity: 0.5; pointer-events: none; }

/* ---------- loops ---------- */
.loops { display: grid; gap: 10px; margin-top: 12px; }
.loop {
  display: grid; grid-template-columns: auto 1fr auto; gap: 10px 12px; align-items: center;
  padding: 10px 12px; background: var(--panel-2);
}
.loop > * { min-width: 0; }
.loop .toggle { text-align: start; line-height: 1.3; }
.loop .toggle small { display: block; color: var(--muted); letter-spacing: 0.04em; margin-top: 2px; }
.loop .toggle.on small { color: #8ad89a; }
.loop label { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.loop label input { flex: 1; width: auto; min-width: 70px; }
.loop .keycap { background: var(--line-hi); color: var(--text); padding: 2px 5px; margin-inline-start: 6px; line-height: 1; }

/* ---------- sequencer ---------- */
.seq-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; color: var(--muted); }
.seq-controls label { display: flex; align-items: center; gap: 6px; }
.seq-grid { display: grid; grid-template-columns: 118px repeat(16, 1fr); gap: 4px; overflow-x: auto; padding-bottom: 4px; direction: ltr; }
.seq-label span:last-child { direction: inherit; unicode-bidi: plaintext; }
.seq-label { display: flex; align-items: center; gap: 8px; white-space: nowrap; padding-inline-end: 6px; cursor: pointer; overflow: hidden; }
.seq-label span:last-child { overflow: hidden; text-overflow: ellipsis; }
.seq-label .dot { width: 8px; height: 8px; background: var(--pad-color, var(--accent)); flex: none; }
.seq-head { height: 6px; background: var(--line); }
.seq-head.beat { background: var(--line-hi); }
.seq-head.cur { background: var(--accent-2); }
.step {
  aspect-ratio: 1; min-width: 22px; border: 0; background: var(--pad); cursor: pointer; padding: 0;
  box-shadow: inset 1px 1px 0 var(--bevel-l), inset -1px -1px 0 var(--bevel-d);
  transition: background 0.08s;
}
.step.beat { background: #262c37; }
.step.on { background: var(--pad-color, var(--accent)); box-shadow: inset -2px -2px 0 rgba(0,0,0,0.4), inset 2px 2px 0 rgba(255,255,255,0.25); }
.step.cur { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.7); }
.step.on.cur { filter: brightness(1.3); }
.step:hover { filter: brightness(1.2); }

/* ---------- footer + toast ---------- */
.foot { max-width: 1240px; margin: 0 auto; padding-block: 8px 28px; padding-inline: 20px; color: var(--muted); }
.toast {
  position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); inset-inline-start: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--panel-2); color: var(--text); padding: 10px 14px; opacity: 0; pointer-events: none;
  transition: opacity 0.15s, transform 0.15s; z-index: 60; max-width: calc(100% - 32px);
}
html[dir="rtl"] .toast { transform: translateX(50%) translateY(20px); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
html[dir="rtl"] .toast.show { transform: translateX(50%) translateY(0); }

@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; grid-template-areas: "machine" "pads" "seq"; padding-inline: 12px; padding-block: 14px 8px; }
  .topbar { padding: 12px; }
  .master { width: 100%; }
  input[type=range] { width: 90px; }
  .seq-grid { grid-template-columns: 96px repeat(16, minmax(20px, 1fr)); }
  .loop { grid-template-columns: 1fr auto; }
  .loop label { grid-column: 1 / -1; }
  .pads { grid-template-columns: repeat(2, 1fr); }
}

html, body { background: var(--bg); }

/* ============================================================
   Industrial Sound Synth
   All sounds are generated with the Web Audio API — no samples.
   Every sound function has the signature
       fn(ctx, dest, t, opts) -> durationSeconds
   so it works both live (AudioContext) and offline
   (OfflineAudioContext) for WAV export.
   Loop sounds (rotation / drone) return a handle:
       { stop(t), scheduleUntil(t), setParam(v) }
   ============================================================ */
const Synth = (() => {
  const rnd = (a, b) => a + Math.random() * (b - a);
  const MIN = 0.0001;

  /* ---------- shared buffers ---------- */
  const noiseCache = new WeakMap();
  function noiseBuffer(ctx) {
    let b = noiseCache.get(ctx);
    if (!b) {
      const len = ctx.sampleRate * 2;
      b = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      noiseCache.set(ctx, b);
    }
    return b;
  }
  function noiseSrc(ctx, t, dur) {
    const s = ctx.createBufferSource();
    s.buffer = noiseBuffer(ctx);
    s.loop = true;
    s.loopStart = 0;
    s.loopEnd = 2;
    // random offset so successive hits don't sound identical
    s.start(t, Math.random() * 1.5);
    s.stop(t + dur + 0.05);
    return s;
  }
  function impulse(ctx, seconds, decay) {
    const len = Math.floor(ctx.sampleRate * seconds);
    const b = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = b.getChannelData(c);
      for (let i = 0; i < len; i++) {
        const x = i / len;
        // early metallic reflections + exponential tail
        let v = (Math.random() * 2 - 1) * Math.pow(1 - x, decay);
        if (i % 1471 < 8 && x < 0.2) v *= 3;
        d[i] = v;
      }
    }
    return b;
  }
  const curveCache = new WeakMap();
  function distCurve(ctx, k) {
    let m = curveCache.get(ctx);
    if (!m) { m = {}; curveCache.set(ctx, m); }
    if (!m[k]) {
      const n = 1024, c = new Float32Array(n);
      for (let i = 0; i < n; i++) {
        const x = (i / (n - 1)) * 2 - 1;
        c[i] = Math.tanh(x * k) / Math.tanh(k);
      }
      m[k] = c;
    }
    return m[k];
  }

  /* ---------- helpers ---------- */
  function env(ctx, t, peak, attack, decay, floor = MIN) {
    const g = ctx.createGain();
    g.gain.setValueAtTime(MIN, t);
    g.gain.exponentialRampToValueAtTime(Math.max(peak, MIN), t + attack);
    g.gain.exponentialRampToValueAtTime(floor, t + attack + decay);
    return g;
  }
  function osc(ctx, type, f, t, dur) {
    const o = ctx.createOscillator();
    o.type = type;
    o.frequency.value = f;
    o.start(t);
    o.stop(t + dur);
    return o;
  }
  function filt(ctx, type, f, q) {
    const b = ctx.createBiquadFilter();
    b.type = type;
    b.frequency.value = f;
    if (q !== undefined) b.Q.value = q;
    return b;
  }

  /* ---------- master bus ---------- */
  function buildMaster(ctx) {
    const input = ctx.createGain();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14;
    comp.knee.value = 18;
    comp.ratio.value = 5;
    comp.attack.value = 0.004;
    comp.release.value = 0.22;
    const master = ctx.createGain();
    master.gain.value = 0.8;

    const conv = ctx.createConvolver();
    conv.buffer = impulse(ctx, 2.2, 3.2);
    const wet = ctx.createGain();
    wet.gain.value = 0.28;
    const wetHp = filt(ctx, 'highpass', 180);

    input.connect(comp);
    input.connect(wetHp).connect(conv).connect(wet).connect(comp);
    comp.connect(master).connect(ctx.destination);
    return { input, wet, master, comp };
  }

  /* ============================================================
     ONE-SHOTS
     ============================================================ */

  /** 敲石头 — stone hit: dry crack + low knock + debris grit */
  function stone(ctx, dest, t, o = {}) {
    const f = o.pitch || rnd(0.85, 1.15);
    const out = ctx.createGain(); out.gain.value = (o.gain ?? 1) * 1.6; out.connect(dest);

    const n = noiseSrc(ctx, t, 0.25);
    const bp = filt(ctx, 'bandpass', 2600 * f, 0.9);
    bp.frequency.setValueAtTime(2600 * f, t);
    bp.frequency.exponentialRampToValueAtTime(650 * f, t + 0.08);
    n.connect(bp).connect(env(ctx, t, 0.9, 0.002, 0.09)).connect(out);

    const k = osc(ctx, 'sine', 220 * f, t, 0.15);
    k.frequency.setValueAtTime(230 * f, t);
    k.frequency.exponentialRampToValueAtTime(65 * f, t + 0.05);
    k.connect(env(ctx, t, 0.75, 0.001, 0.07)).connect(out);

    const n2 = noiseSrc(ctx, t + 0.012, 0.22);
    const lp = filt(ctx, 'lowpass', 1300 * f, 0.5);
    n2.connect(lp).connect(env(ctx, t + 0.012, 0.35, 0.005, 0.16)).connect(out);

    // tiny secondary chip bouncing off
    if (Math.random() < 0.6) {
      const dt = rnd(0.07, 0.14);
      const n3 = noiseSrc(ctx, t + dt, 0.08);
      const bp3 = filt(ctx, 'bandpass', 3400 * f, 2);
      n3.connect(bp3).connect(env(ctx, t + dt, 0.25, 0.001, 0.04)).connect(out);
    }
    return 0.45;
  }

  /** 敲管道 — hollow metal pipe: free-bar modal partials with beating + clank */
  function pipe(ctx, dest, t, o = {}) {
    const f0 = o.f0 || rnd(170, 430);
    const ratios = [1, 2.756, 5.404, 8.933, 13.34];
    const amps = [1, 0.62, 0.42, 0.24, 0.12];
    const out = ctx.createGain(); out.gain.value = (o.gain ?? 1) * 0.45;
    const hp = filt(ctx, 'highpass', 110);
    out.connect(hp).connect(dest);

    ratios.forEach((r, i) => {
      const dec = 1.5 / (1 + i * 0.7);
      [-1.6, 1.6].forEach(det => {
        const oo = osc(ctx, 'sine', f0 * r * (1 + det / 1000), t, dec + 0.1);
        oo.connect(env(ctx, t, amps[i] * 0.5, 0.002, dec)).connect(out);
      });
    });
    // pipe resonance (air column) — hollow tone
    const air = osc(ctx, 'triangle', f0 * 0.5, t, 0.5);
    air.connect(filt(ctx, 'lowpass', 900)).connect(env(ctx, t, 0.35, 0.003, 0.35)).connect(out);

    // clank excitation
    const n = noiseSrc(ctx, t, 0.1);
    const bp = filt(ctx, 'bandpass', f0 * 4, 2);
    n.connect(bp).connect(env(ctx, t, 0.9, 0.001, 0.045)).connect(out);
    return 2.0;
  }

  /** 机器撞击 — heavy machine impact: sub thud + distorted clang + slam noise */
  function impact(ctx, dest, t, o = {}) {
    const out = ctx.createGain(); out.gain.value = o.gain ?? 1; out.connect(dest);

    const s = osc(ctx, 'sine', 110, t, 0.7);
    s.frequency.setValueAtTime(115, t);
    s.frequency.exponentialRampToValueAtTime(31, t + 0.18);
    s.connect(env(ctx, t, 1.0, 0.003, 0.5)).connect(out);

    const shaper = ctx.createWaveShaper();
    shaper.curve = distCurve(ctx, 6);
    shaper.oversample = '2x';
    const cl = ctx.createGain(); cl.gain.value = 0.45;
    [151, 387, 612, 1023, 1580, 2210].forEach((f, i) => {
      const oo = osc(ctx, i < 2 ? 'triangle' : 'sine', f * rnd(0.98, 1.02), t, 1.3);
      oo.connect(env(ctx, t, 0.55 / (1 + i * 0.5), 0.002, 0.95 - i * 0.1)).connect(shaper);
    });
    shaper.connect(cl).connect(filt(ctx, 'highpass', 90)).connect(out);

    const n = noiseSrc(ctx, t, 0.3);
    const lp = filt(ctx, 'lowpass', 5000, 0.7);
    lp.frequency.setValueAtTime(5500, t);
    lp.frequency.exponentialRampToValueAtTime(260, t + 0.22);
    n.connect(lp).connect(env(ctx, t, 0.9, 0.002, 0.24)).connect(out);

    // rattling aftermath
    for (let i = 0; i < 3; i++) {
      const dt = 0.12 + i * rnd(0.05, 0.09);
      const nr = noiseSrc(ctx, t + dt, 0.06);
      nr.connect(filt(ctx, 'bandpass', rnd(900, 2200), 3))
        .connect(env(ctx, t + dt, 0.18 / (i + 1), 0.001, 0.035)).connect(out);
    }
    return 1.6;
  }

  /** 敲铃铛 — bell: inharmonic partials with independent decays */
  function bell(ctx, dest, t, o = {}) {
    const f0 = o.f0 || rnd(380, 640);
    //           ratio  amp  decay
    const P = [[0.5, 0.6, 4.0], [1, 1, 3.3], [1.183, 0.5, 2.6], [1.506, 0.5, 2.3],
               [2, 0.4, 1.9], [2.514, 0.3, 1.5], [2.662, 0.25, 1.4], [3.011, 0.2, 1.2],
               [4.166, 0.12, 0.9], [5.433, 0.08, 0.7]];
    const out = ctx.createGain(); out.gain.value = (o.gain ?? 1) * 0.32; out.connect(dest);
    P.forEach(([r, a, d]) => {
      const oo = osc(ctx, 'sine', f0 * r * rnd(0.999, 1.001), t, d + 0.1);
      oo.connect(env(ctx, t, a, 0.002, d)).connect(out);
    });
    const n = noiseSrc(ctx, t, 0.05);
    n.connect(filt(ctx, 'bandpass', f0 * 3, 3)).connect(env(ctx, t, 0.5, 0.001, 0.03)).connect(out);
    return 4.3;
  }

  /** 敲镲 — cymbal (808-style): 6 detuned squares + noise, clipped, hi-passed, dual envelope */
  function cymbal(ctx, dest, t, o = {}) {
    const decay = o.decay || rnd(1.6, 2.2);
    const out = ctx.createGain(); out.gain.value = (o.gain ?? 1) * 1.3; out.connect(dest);
    const mix = ctx.createGain(); mix.gain.value = 0.18;
    [205.3, 304.4, 369.6, 522.7, 540, 800].forEach(f => {
      osc(ctx, 'square', f * rnd(0.99, 1.01), t, decay + 0.3).connect(mix);
    });
    const n = noiseSrc(ctx, t, decay + 0.3);
    const ng = ctx.createGain(); ng.gain.value = 0.7;
    n.connect(ng).connect(mix);

    const shaper = ctx.createWaveShaper();
    shaper.curve = distCurve(ctx, 3);
    const hp = filt(ctx, 'highpass', 6500, 0.5);
    const bp = filt(ctx, 'bandpass', 9500, 0.7);
    const bp2 = filt(ctx, 'bandpass', 3800, 1.2);
    mix.connect(shaper).connect(hp);
    hp.connect(env(ctx, t, 0.9, 0.001, 0.28)).connect(out);                 // bright edge
    hp.connect(bp).connect(env(ctx, t, 0.5, 0.008, decay)).connect(out);     // shimmering body
    hp.connect(bp2).connect(env(ctx, t, 0.25, 0.02, decay * 0.7)).connect(out); // metal wash
    return decay + 0.6;
  }

  /** 牛铃 — cowbell (808-style): two squares 587/845 Hz, bandpass, quick-decay */
  function cowbell(ctx, dest, t, o = {}) {
    const f = o.pitch || rnd(0.97, 1.03);
    const out = ctx.createGain(); out.gain.value = (o.gain ?? 1) * 0.6; out.connect(dest);
    const bp = filt(ctx, 'bandpass', 1850 * f, 1.1);
    const g = ctx.createGain();
    g.gain.setValueAtTime(MIN, t);
    g.gain.exponentialRampToValueAtTime(1, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.35, t + 0.035);
    g.gain.exponentialRampToValueAtTime(MIN, t + 0.42);
    [587, 845].forEach(fr => {
      const oo = osc(ctx, 'square', fr * f, t, 0.5);
      oo.frequency.setValueAtTime(fr * f * 1.03, t);
      oo.frequency.exponentialRampToValueAtTime(fr * f, t + 0.02);
      oo.connect(bp);
    });
    const shaper = ctx.createWaveShaper();
    shaper.curve = distCurve(ctx, 2);
    bp.connect(g).connect(shaper).connect(out);
    // stick click
    const n = noiseSrc(ctx, t, 0.03);
    n.connect(filt(ctx, 'highpass', 3000)).connect(env(ctx, t, 0.4, 0.001, 0.015)).connect(out);
    return 0.6;
  }

  /** 机器喷气 — pressurised steam vent: valve pop + swept hiss */
  function steam(ctx, dest, t, o = {}) {
    const dur = o.dur || rnd(0.9, 1.3);
    const out = ctx.createGain(); out.gain.value = o.gain ?? 1; out.connect(dest);

    const n = noiseSrc(ctx, t, dur + 0.1);
    const hp = filt(ctx, 'highpass', 600, 0.7);
    hp.frequency.setValueAtTime(500, t);
    hp.frequency.exponentialRampToValueAtTime(3800, t + 0.15);
    hp.frequency.exponentialRampToValueAtTime(1400, t + dur);
    const bp = filt(ctx, 'bandpass', 3000, 0.6);
    bp.frequency.setValueAtTime(2800, t);
    bp.frequency.exponentialRampToValueAtTime(6500, t + 0.2);
    bp.frequency.exponentialRampToValueAtTime(2200, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(MIN, t);
    g.gain.exponentialRampToValueAtTime(0.85, t + 0.03);
    g.gain.setValueAtTime(0.85, t + 0.25);
    g.gain.exponentialRampToValueAtTime(MIN, t + dur);
    n.connect(hp).connect(bp).connect(g).connect(out);

    // low pressure body under the hiss
    const n2 = noiseSrc(ctx, t, dur);
    n2.connect(filt(ctx, 'bandpass', 450, 1.5)).connect(env(ctx, t, 0.3, 0.04, dur * 0.8)).connect(out);

    // valve pop
    const p = osc(ctx, 'square', 400, t, 0.1);
    p.frequency.setValueAtTime(420, t);
    p.frequency.exponentialRampToValueAtTime(70, t + 0.03);
    p.connect(filt(ctx, 'lowpass', 1500)).connect(env(ctx, t, 0.28, 0.001, 0.045)).connect(out);
    return dur + 0.3;
  }


  /** 铁砧 — anvil: bright inharmonic ring + hammer thunk + click */
  function anvil(ctx, dest, t, o = {}) {
    const f0 = o.f0 || rnd(1450, 1750);
    const out = ctx.createGain(); out.gain.value = (o.gain ?? 1) * 0.5; out.connect(dest);
    const P = [[1, 1, 1.3], [1.58, 0.55, 1.0], [2.36, 0.35, 0.8], [3.13, 0.22, 0.6], [4.42, 0.12, 0.4]];
    P.forEach(([r, a, d]) => {
      [-0.8, 0.8].forEach(det => {
        const oo = osc(ctx, 'sine', f0 * r * (1 + det / 1000), t, d + 0.1);
        oo.connect(env(ctx, t, a * 0.5, 0.001, d)).connect(out);
      });
    });
    const k = osc(ctx, 'sine', 180, t, 0.15);
    k.frequency.setValueAtTime(190, t);
    k.frequency.exponentialRampToValueAtTime(80, t + 0.05);
    k.connect(env(ctx, t, 0.8, 0.001, 0.08)).connect(out);
    const n = noiseSrc(ctx, t, 0.04);
    n.connect(filt(ctx, 'highpass', 4000)).connect(env(ctx, t, 0.7, 0.0005, 0.02)).connect(out);
    return 1.6;
  }

  /** 铁链 — chain: cascade of tiny link clinks over a low rattle */
  function chain(ctx, dest, t, o = {}) {
    const out = ctx.createGain(); out.gain.value = (o.gain ?? 1) * 1.2; out.connect(dest);
    const hp = filt(ctx, 'highpass', 900); hp.connect(out);
    const links = o.links || Math.round(rnd(10, 16));
    let at = t;
    for (let i = 0; i < links; i++) {
      const f = rnd(2200, 6500);
      const fade = 1 - (i / links) * 0.6;
      const n = noiseSrc(ctx, at, 0.06);
      n.connect(filt(ctx, 'bandpass', f, 9)).connect(env(ctx, at, rnd(0.4, 0.9) * fade, 0.001, 0.035)).connect(hp);
      const s = osc(ctx, 'sine', f * rnd(0.9, 1.1), at, 0.08);
      s.connect(env(ctx, at, 0.25 * fade, 0.001, 0.05)).connect(hp);
      at += rnd(0.012, 0.05) * (1 + (i / links) * 1.5);
    }
    const n2 = noiseSrc(ctx, t, 0.5);
    n2.connect(filt(ctx, 'bandpass', 700, 3)).connect(env(ctx, t, 0.3, 0.005, 0.4)).connect(out);
    return at - t + 0.5;
  }

  /** 冲压机 — hydraulic press: hiss build-up, massive slam, exhaust */
  const PRESS_SLAM_AT = 0.26;
  function press(ctx, dest, t, o = {}) {
    const out = ctx.createGain(); out.gain.value = o.gain ?? 1; out.connect(dest);
    const h = noiseSrc(ctx, t, 0.3);
    const hb = filt(ctx, 'bandpass', 1800, 1.5);
    hb.frequency.setValueAtTime(2500, t);
    hb.frequency.exponentialRampToValueAtTime(900, t + 0.25);
    const hg = ctx.createGain();
    hg.gain.setValueAtTime(MIN, t);
    hg.gain.exponentialRampToValueAtTime(0.35, t + 0.05);
    hg.gain.exponentialRampToValueAtTime(0.5, t + 0.22);
    hg.gain.exponentialRampToValueAtTime(MIN, t + 0.27);
    h.connect(hb).connect(hg).connect(out);

    const ts = t + PRESS_SLAM_AT;
    const s = osc(ctx, 'sine', 70, ts, 0.8);
    s.frequency.setValueAtTime(75, ts);
    s.frequency.exponentialRampToValueAtTime(24, ts + 0.25);
    s.connect(env(ctx, ts, 1.1, 0.002, 0.6)).connect(out);
    const n = noiseSrc(ctx, ts, 0.3);
    const lp = filt(ctx, 'lowpass', 3000, 0.8);
    lp.frequency.setValueAtTime(3500, ts);
    lp.frequency.exponentialRampToValueAtTime(200, ts + 0.25);
    n.connect(lp).connect(env(ctx, ts, 1.0, 0.001, 0.28)).connect(out);
    const shaper = ctx.createWaveShaper(); shaper.curve = distCurve(ctx, 5);
    const cg = ctx.createGain(); cg.gain.value = 0.35;
    shaper.connect(cg).connect(out);
    [95, 240, 410, 730].forEach((f, i) => {
      const oo = osc(ctx, 'triangle', f * rnd(0.98, 1.02), ts, 0.8);
      oo.connect(env(ctx, ts, 0.5 / (1 + i * 0.6), 0.002, 0.5 - i * 0.08)).connect(shaper);
    });
    const tr = ts + 0.35;
    const r = noiseSrc(ctx, tr, 0.4);
    r.connect(filt(ctx, 'highpass', 2500)).connect(env(ctx, tr, 0.3, 0.02, 0.3)).connect(out);
    return 1.6;
  }

  /** 油桶 — oil drum: hollow resonant body, boom, lid boing, slap */
  function drum(ctx, dest, t, o = {}) {
    const f = o.pitch || rnd(0.9, 1.1);
    const out = ctx.createGain(); out.gain.value = (o.gain ?? 1) * 0.9; out.connect(dest);
    const ex = noiseSrc(ctx, t, 0.12);
    const exg = env(ctx, t, 1, 0.001, 0.06);
    ex.connect(exg);
    [[118, 10, 0.9], [236, 9, 0.6], [402, 8, 0.4], [610, 7, 0.25]].forEach(([fr, q, a]) => {
      const b = filt(ctx, 'bandpass', fr * f, q);
      const g = ctx.createGain(); g.gain.value = a * 2;
      exg.connect(b).connect(g).connect(out);
    });
    const s = osc(ctx, 'sine', 130 * f, t, 0.7);
    s.frequency.setValueAtTime(140 * f, t);
    s.frequency.exponentialRampToValueAtTime(68 * f, t + 0.12);
    s.connect(env(ctx, t, 0.9, 0.002, 0.5)).connect(out);
    [760, 1180, 1540].forEach((fr, i) => {
      const oo = osc(ctx, 'sine', fr * f, t, 0.6);
      oo.frequency.setValueAtTime(fr * f * 1.04, t);
      oo.frequency.exponentialRampToValueAtTime(fr * f, t + 0.15);
      oo.connect(env(ctx, t, 0.18 / (i + 1), 0.002, 0.45)).connect(out);
    });
    const n = noiseSrc(ctx, t, 0.05);
    n.connect(filt(ctx, 'bandpass', 2500, 1)).connect(env(ctx, t, 0.5, 0.001, 0.03)).connect(out);
    return 1.2;
  }

  /** 铁皮板 — sheet metal: wobbling resonant noise (thunder sheet) */
  function sheet(ctx, dest, t, o = {}) {
    const out = ctx.createGain(); out.gain.value = (o.gain ?? 1) * 1.5; out.connect(dest);
    const dur = o.dur || 1.6;
    const n = noiseSrc(ctx, t, dur + 0.2);
    const ng = env(ctx, t, 1, 0.002, dur);
    n.connect(ng);
    const wob = osc(ctx, 'sine', 7, t, dur + 0.2);
    const wg = ctx.createGain();
    wg.gain.setValueAtTime(0, t);
    wg.gain.linearRampToValueAtTime(0.18, t + 0.05);
    wg.gain.exponentialRampToValueAtTime(0.001, t + dur);
    wob.connect(wg);
    [[380, 12, 0.9], [860, 10, 0.7], [1650, 9, 0.5], [3100, 8, 0.35], [5200, 7, 0.2]].forEach(([f, q, a]) => {
      const b = filt(ctx, 'bandpass', f, q);
      const dg = ctx.createGain(); dg.gain.value = 600;   // cents of wobble
      wg.connect(dg).connect(b.detune);
      const g = ctx.createGain(); g.gain.value = a * 1.8;
      ng.connect(b).connect(g).connect(out);
    });
    const sl = noiseSrc(ctx, t, 0.05);
    sl.connect(filt(ctx, 'lowpass', 2000)).connect(env(ctx, t, 0.8, 0.001, 0.03)).connect(out);
    const k = osc(ctx, 'sine', 90, t, 0.2);
    k.frequency.setValueAtTime(90, t);
    k.frequency.exponentialRampToValueAtTime(45, t + 0.1);
    k.connect(env(ctx, t, 0.5, 0.002, 0.15)).connect(out);
    return dur + 0.5;
  }

  /** 汽笛 — steam whistle: chord of partials with vibrato, pitch scoop, breath */
  function whistle(ctx, dest, t, o = {}) {
    const f = o.f0 || rnd(620, 760);
    const dur = o.dur || rnd(0.9, 1.4);
    const out = ctx.createGain(); out.gain.value = (o.gain ?? 1) * 0.35; out.connect(dest);
    const g = ctx.createGain();
    g.gain.setValueAtTime(MIN, t);
    g.gain.exponentialRampToValueAtTime(1, t + 0.09);
    g.gain.setValueAtTime(1, t + dur - 0.25);
    g.gain.exponentialRampToValueAtTime(MIN, t + dur);
    g.connect(out);
    const vib = osc(ctx, 'sine', 5.5, t, dur + 0.1);
    const vg = ctx.createGain(); vg.gain.value = 14;      // cents
    vib.connect(vg);
    [[1, 1, 'triangle'], [1.26, 0.5, 'sine'], [1.5, 0.6, 'triangle'], [2, 0.25, 'sine'], [3.02, 0.1, 'sine']].forEach(([r, a, type]) => {
      const oo = osc(ctx, type, f * r, t, dur + 0.1);
      oo.frequency.setValueAtTime(f * r * 0.8, t);
      oo.frequency.exponentialRampToValueAtTime(f * r, t + 0.12);
      oo.frequency.setValueAtTime(f * r, t + dur - 0.15);
      oo.frequency.exponentialRampToValueAtTime(f * r * 0.9, t + dur);
      vg.connect(oo.detune);
      const ag = ctx.createGain(); ag.gain.value = a;
      oo.connect(ag).connect(g);
    });
    const n = noiseSrc(ctx, t, dur + 0.1);
    const bg = ctx.createGain(); bg.gain.value = 0.3;
    n.connect(filt(ctx, 'bandpass', f * 1.5, 3)).connect(bg).connect(g);
    return dur + 0.5;
  }

  /** 电焊 — welding: arc buzz with tremolo, hiss, dense crackles */
  function welder(ctx, dest, t, o = {}) {
    const dur = o.dur || rnd(0.5, 0.9);
    const out = ctx.createGain(); out.gain.value = (o.gain ?? 1) * 0.7; out.connect(dest);
    const g = ctx.createGain();
    g.gain.setValueAtTime(MIN, t);
    g.gain.exponentialRampToValueAtTime(0.5, t + 0.02);
    g.gain.setValueAtTime(0.5, t + dur - 0.05);
    g.gain.exponentialRampToValueAtTime(MIN, t + dur);
    g.connect(out);
    const b1 = osc(ctx, 'sawtooth', 100, t, dur + 0.1);
    const b2 = osc(ctx, 'square', 120, t, dur + 0.1);
    const bl = filt(ctx, 'lowpass', 1800, 1);
    const bg = ctx.createGain(); bg.gain.value = 0.5;
    const trem = osc(ctx, 'square', rnd(28, 40), t, dur + 0.1);
    const tg = ctx.createGain(); tg.gain.value = 0.4;
    trem.connect(tg).connect(bg.gain);
    b1.connect(bl); b2.connect(bl); bl.connect(bg).connect(g);
    const n = noiseSrc(ctx, t, dur + 0.1);
    const hg = ctx.createGain(); hg.gain.value = 0.25;
    n.connect(filt(ctx, 'highpass', 3000)).connect(hg).connect(g);
    let at = t + 0.01;
    while (at < t + dur) {
      const c = noiseSrc(ctx, at, 0.012);
      c.connect(filt(ctx, 'highpass', rnd(2500, 6000))).connect(env(ctx, at, rnd(0.3, 1), 0.0005, 0.006)).connect(out);
      at += rnd(0.006, 0.04);
    }
    return dur + 0.3;
  }

  /** 螺栓掉落 — falling bolts: a few bouncing bolts with shrinking bounce intervals */
  function bolts(ctx, dest, t, o = {}) {
    const out = ctx.createGain(); out.gain.value = (o.gain ?? 1) * 1.0; out.connect(dest);
    const count = o.count || Math.round(rnd(2, 4));
    let end = t;
    for (let b = 0; b < count; b++) {
      let at = t + b * rnd(0.03, 0.12);
      let gap = rnd(0.12, 0.2);
      let amp = 1;
      const f = rnd(1800, 3400);
      for (let i = 0; i < 7 && amp > 0.08; i++) {
        const n = noiseSrc(ctx, at, 0.05);
        n.connect(filt(ctx, 'bandpass', f * rnd(0.95, 1.05), 7)).connect(env(ctx, at, 0.7 * amp, 0.001, 0.03)).connect(out);
        const s = osc(ctx, 'sine', f * 1.5, at, 0.1);
        s.connect(env(ctx, at, 0.3 * amp, 0.001, 0.06)).connect(out);
        const k = osc(ctx, 'sine', 320, at, 0.06);
        k.frequency.setValueAtTime(320, at);
        k.frequency.exponentialRampToValueAtTime(150, at + 0.03);
        k.connect(env(ctx, at, 0.35 * amp, 0.001, 0.04)).connect(out);
        at += gap; gap *= rnd(0.55, 0.7); amp *= 0.65;
      }
      end = Math.max(end, at);
    }
    const r = noiseSrc(ctx, end, 0.25);
    r.connect(filt(ctx, 'bandpass', 2500, 4)).connect(env(ctx, end, 0.15, 0.01, 0.2)).connect(out);
    return end - t + 0.5;
  }

  /* ============================================================
     LOOPS
     ============================================================ */

  /** 机器转动 — rotating machinery: motor hum + whir + rhythmic clanks */
  function startRotation(ctx, dest, t, o = {}) {
    let speed = o.speed || 1;                 // revolutions per second
    const out = ctx.createGain();
    out.gain.setValueAtTime(MIN, t);
    out.gain.exponentialRampToValueAtTime(0.75, t + 0.9);
    out.connect(dest);

    // motor
    const motor = ctx.createOscillator(); motor.type = 'sawtooth';
    motor.frequency.setValueAtTime(28, t);
    motor.frequency.exponentialRampToValueAtTime(52 * speed, t + 1.6);
    const mlp = filt(ctx, 'lowpass', 340, 4);
    const lfo = ctx.createOscillator(); lfo.frequency.setValueAtTime(2.2 * speed, t);
    const lfoG = ctx.createGain(); lfoG.gain.value = 140;
    lfo.connect(lfoG).connect(mlp.frequency);
    const mg = ctx.createGain(); mg.gain.value = 0.5;
    motor.connect(mlp).connect(mg).connect(out);

    // belt whir
    const n = ctx.createBufferSource(); n.buffer = noiseBuffer(ctx); n.loop = true;
    const wbp = filt(ctx, 'bandpass', 1200, 5);
    const lfo2 = ctx.createOscillator(); lfo2.frequency.setValueAtTime(speed * 1.1, t);
    const l2g = ctx.createGain(); l2g.gain.value = 550;
    lfo2.connect(l2g).connect(wbp.frequency);
    const wg = ctx.createGain(); wg.gain.value = 0.22;
    n.connect(wbp).connect(wg).connect(out);

    // gear grind (lower noise, pulsing)
    const n2 = ctx.createBufferSource(); n2.buffer = noiseBuffer(ctx); n2.loop = true;
    const gbp = filt(ctx, 'bandpass', 380, 3);
    const gg = ctx.createGain(); gg.gain.value = 0.18;
    const lfo3 = ctx.createOscillator(); lfo3.type = 'square'; lfo3.frequency.setValueAtTime(speed * 4, t);
    const l3g = ctx.createGain(); l3g.gain.value = 0.1;
    lfo3.connect(l3g).connect(gg.gain);
    n2.connect(gbp).connect(gg).connect(out);

    [motor, lfo, lfo2, lfo3, n, n2].forEach(x => x.start(t));

    // rhythmic clanks — scheduled ahead in chunks
    let nextClank = t + 0.4;
    let clankIndex = 0;
    function clank(at, accent) {
      const c = noiseSrc(ctx, at, 0.09);
      c.connect(filt(ctx, 'bandpass', accent ? 900 : 1400, 6))
        .connect(env(ctx, at, accent ? 0.5 : 0.28, 0.001, 0.06)).connect(out);
      const k = osc(ctx, 'sine', accent ? 140 : 210, at, 0.12);
      k.connect(env(ctx, at, accent ? 0.45 : 0.2, 0.001, 0.07)).connect(out);
    }
    function scheduleUntil(until) {
      while (nextClank < until) {
        clank(nextClank, clankIndex % 2 === 0);
        clankIndex++;
        nextClank += 0.5 / speed;
      }
    }
    function setParam(v) {
      speed = v;
      const now = ctx.currentTime;
      motor.frequency.cancelScheduledValues(now);
      motor.frequency.setTargetAtTime(52 * speed, now, 0.4);
      lfo.frequency.setTargetAtTime(2.2 * speed, now, 0.3);
      lfo2.frequency.setTargetAtTime(1.1 * speed, now, 0.3);
      lfo3.frequency.setTargetAtTime(4 * speed, now, 0.3);
    }
    function stop(at) {
      out.gain.cancelScheduledValues(at);
      out.gain.setValueAtTime(out.gain.value || 0.75, at);
      out.gain.exponentialRampToValueAtTime(MIN, at + 0.7);
      motor.frequency.cancelScheduledValues(at);
      motor.frequency.setTargetAtTime(20, at, 0.35);
      [motor, lfo, lfo2, lfo3, n, n2].forEach(x => x.stop(at + 0.8));
      nextClank = Infinity;
    }
    return { stop, scheduleUntil, setParam };
  }

  /** 沉闷的机器声 — dull, muffled machine room drone */
  function startDrone(ctx, dest, t, o = {}) {
    let muffle = o.muffle ?? 0.5;             // 0 = brighter, 1 = very muffled
    const cutoff = () => 900 - muffle * 720;  // 900 → 180 Hz
    const out = ctx.createGain();
    out.gain.setValueAtTime(MIN, t);
    out.gain.exponentialRampToValueAtTime(0.85, t + 1.6);
    const lp = filt(ctx, 'lowpass', cutoff(), 0.8);
    lp.connect(out); out.connect(dest);

    // mains hum stack
    const hum = ctx.createGain(); hum.gain.value = 0.55;
    const h1 = osc0(ctx, 'sine', 50);
    const h2 = osc0(ctx, 'triangle', 100); const h2g = ctx.createGain(); h2g.gain.value = 0.35;
    const h3 = osc0(ctx, 'sine', 149.3);    const h3g = ctx.createGain(); h3g.gain.value = 0.12;
    h1.connect(hum); h2.connect(h2g).connect(hum); h3.connect(h3g).connect(hum);
    const am = osc0(ctx, 'sine', 0.37); const amg = ctx.createGain(); amg.gain.value = 0.2;
    am.connect(amg).connect(hum.gain);
    hum.connect(lp);

    // heavy rumble
    const rum = osc0(ctx, 'sawtooth', 27.5);
    const rlp = filt(ctx, 'lowpass', 85, 1);
    const rg = ctx.createGain(); rg.gain.value = 0.45;
    rum.connect(rlp).connect(rg).connect(lp);

    // brown-ish noise floor
    const n = ctx.createBufferSource(); n.buffer = noiseBuffer(ctx); n.loop = true;
    const nl1 = filt(ctx, 'lowpass', 140); const nl2 = filt(ctx, 'lowpass', 160);
    const ng = ctx.createGain(); ng.gain.value = 1.4;
    n.connect(nl1).connect(nl2).connect(ng).connect(lp);

    // ventilation swoosh, slowly wandering
    const v = ctx.createBufferSource(); v.buffer = noiseBuffer(ctx); v.loop = true;
    const vbp = filt(ctx, 'bandpass', 320, 2.5);
    const vlfo = osc0(ctx, 'sine', 0.11); const vlg = ctx.createGain(); vlg.gain.value = 120;
    vlfo.connect(vlg).connect(vbp.frequency);
    const vg = ctx.createGain(); vg.gain.value = 0.16;
    v.connect(vbp).connect(vg).connect(lp);

    const srcs = [h1, h2, h3, am, rum, n, v, vlfo];
    srcs.forEach(x => x.start(t));

    // periodic muffled thud + random clunks
    let nextThud = t + 0.8;
    let nextClunk = t + rnd(2, 4);
    function thud(at) {
      const s = osc(ctx, 'sine', 62, at, 0.5);
      s.frequency.setValueAtTime(66, at);
      s.frequency.exponentialRampToValueAtTime(38, at + 0.2);
      s.connect(env(ctx, at, 0.6, 0.005, 0.38)).connect(lp);
    }
    function clunk(at) {
      const c = noiseSrc(ctx, at, 0.2);
      c.connect(filt(ctx, 'lowpass', 320)).connect(env(ctx, at, 0.45, 0.004, 0.16)).connect(lp);
      const k = osc(ctx, 'triangle', rnd(90, 160), at, 0.3);
      k.connect(env(ctx, at, 0.25, 0.003, 0.22)).connect(lp);
    }
    function scheduleUntil(until) {
      while (nextThud < until) { thud(nextThud); nextThud += 0.8; }
      while (nextClunk < until) { clunk(nextClunk); nextClunk += rnd(1.8, 5); }
    }
    function setParam(v) {
      muffle = v;
      lp.frequency.setTargetAtTime(cutoff(), ctx.currentTime, 0.2);
    }
    function stop(at) {
      out.gain.cancelScheduledValues(at);
      out.gain.setValueAtTime(out.gain.value || 0.85, at);
      out.gain.exponentialRampToValueAtTime(MIN, at + 1.0);
      srcs.forEach(x => x.stop(at + 1.1));
      nextThud = Infinity; nextClunk = Infinity;
    }
    return { stop, scheduleUntil, setParam };
  }

  /** 传送带 — conveyor belt: rubber rumble, motor, roller clicks, squeaks */
  function startConveyor(ctx, dest, t, o = {}) {
    let speed = o.speed || 1;
    const out = ctx.createGain();
    out.gain.setValueAtTime(MIN, t);
    out.gain.exponentialRampToValueAtTime(0.7, t + 0.6);
    out.connect(dest);

    const n = ctx.createBufferSource(); n.buffer = noiseBuffer(ctx); n.loop = true;
    const lp = filt(ctx, 'lowpass', 260, 0.8);
    const ng = ctx.createGain(); ng.gain.value = 0.9;
    const am = osc0(ctx, 'sine', 3 * speed);
    const amg = ctx.createGain(); amg.gain.value = 0.3;
    am.connect(amg).connect(ng.gain);
    n.connect(lp).connect(ng).connect(out);

    const m = osc0(ctx, 'square', 60);
    const mlp = filt(ctx, 'lowpass', 220, 2);
    const mg = ctx.createGain(); mg.gain.value = 0.18;
    m.connect(mlp).connect(mg).connect(out);

    const n2 = ctx.createBufferSource(); n2.buffer = noiseBuffer(ctx); n2.loop = true;
    const bp = filt(ctx, 'bandpass', 1800, 2);
    const n2g = ctx.createGain(); n2g.gain.value = 0.05;
    n2.connect(bp).connect(n2g).connect(out);

    const srcs = [n, am, m, n2];
    srcs.forEach(x => x.start(t));

    let nextClick = t + 0.2, nextSqueak = t + rnd(1.5, 3);
    function click(at) {
      const c = noiseSrc(ctx, at, 0.04);
      c.connect(filt(ctx, 'bandpass', rnd(1100, 1500), 5)).connect(env(ctx, at, 0.18, 0.001, 0.02)).connect(out);
    }
    function squeak(at) {
      const s = osc(ctx, 'sine', rnd(2200, 3200), at, 0.25);
      const v = osc(ctx, 'sine', 18, at, 0.25);
      const vg = ctx.createGain(); vg.gain.value = 60;

  /* ============================================================

  /* ============================================================

     ============================================================ */
  async function renderOneShot(fn, opts = {}, sampleRate = 44100) {

    const oc = new OfflineAudioContext(2, Math.ceil(sampleRate * dur), sampleRate);

/* ============================================================
   PixelMachine — a 208×117 pixel-art factory floor.
   Everything is drawn at logical resolution and scaled up with
   image-rendering: pixelated. Each instrument has a physical
   counterpart in the scene that reacts when it is played, and
   clicking a part plays it.
   ============================================================ */
class PixelMachine {
  constructor(canvas) {
    this.cv = canvas;
    this.g = canvas.getContext('2d');
    this.g.imageSmoothingEnabled = false;
    this.W = canvas.width; this.H = canvas.height;
    this.FLOOR = 90;
    this.parts = [];
    this.t = 0;
    this.last = performance.now();
    this.shake = 0;
    this.flash = {};
    this.pressure = 0.25;
    this.gearAngle = 0; this.gearSpeed = 0; this.gearVel = 0;
    this.rotationOn = false;
    this.droneOn = false; this.droneLevel = 0;
    this.beltOn = false; this.beltSpeed = 1; this.beltVel = 0; this.beltOffset = 0;
    this.pistonPhase = 0;
    this.pressT = -1;
    this.bellSwing = 0; this.bellVel = 0;
    this.cowSwing = 0; this.cowVel = 0;

    this.drumTilt = 0; this.drumVel = 0;
    this.stoneJump = 0;
    this.ventOpen = 0;
    this.whistleT = 0; this.whistleTimer = 0;
    this.weldT = 0;
    this.idleTimer = 2;
    this.spawnQueue = [];
    this.onHit = null;
    this.hitZones = [
      { id: 'steam',    x: 106, y: 24, w: 20, h: 26 },
      { id: 'whistle',  x: 62,  y: 34, w: 10, h: 14 },
      { id: 'bell',     x: 24,  y: 24, w: 14, h: 20 },
      { id: 'cowbell',  x: 40,  y: 24, w: 12, h: 20 },
      { id: 'cymbal',   x: 52,  y: 24, w: 15, h: 20 },
      { id: 'chain',    x: 70,  y: 5,  w: 14, h: 41 },
      { id: 'welder',   x: 140, y: 5,  w: 12, h: 33 },
      { id: 'sheet',    x: 152, y: 6,  w: 30, h: 30 },
      { id: 'pipe',     x: 128, y: 36, w: 80, h: 12 },
      { id: 'anvil',    x: 0,   y: 74, w: 20, h: 18 },
      { id: 'stone',    x: 20,  y: 76, w: 16, h: 16 },
      { id: 'bolts',    x: 34,  y: 52, w: 24, h: 8 },
      { id: 'press',    x: 36,  y: 58, w: 20, h: 34 },
      { id: 'drone',    x: 92,  y: 60, w: 8,  h: 7 },
      { id: 'impact',   x: 60,  y: 46, w: 70, h: 46 },
      { id: 'rotation', x: 130, y: 56, w: 50, h: 40 },
      { id: 'drum',     x: 184, y: 64, w: 20, h: 28 },

  /* snap the CSS size to an integer multiple of the logical size so pixels stay square */
  _fitToInteger() {
    const parent = this.cv.parentElement;
    if (!parent || typeof ResizeObserver === 'undefined') return;
    const apply = () => {
      const avail = parent.clientWidth - 6;
      if (avail <= 0) return;

      let w = scale * this.W;

      this.cv.style.width = w + 'px';

  /* ---------- public triggers ---------- */
  trigger(id, strength = 1) {
    switch (id) {
      case 'steam':   this.vent(strength); break;
      case 'impact':  this.shake = Math.max(this.shake, 0.22); this.flash.panel = 0.12;
                      this.sparks(94, 49, 14); this.pressure = Math.min(1, this.pressure + 0.25); break;
      case 'pipe':    this.flash.pipe = 0.15; this.sparks(160, 41, 6); break;
      case 'stone':   this.stoneJump = 1; this.dust(29, 90, 8); break;
      case 'bell':    this.bellVel += 9; break;
      case 'cowbell': this.cowVel += 8; break;
      case 'cymbal':  this.cymVel += 12; this.flash.cym = 0.2; break;
      case 'anvil':   this.flash.anvil = 0.1; this.sparks(10, 79, 12); this.shake = Math.max(this.shake, 0.05); break;
      case 'chain':   this.chainVel += 7; this.chainJitter = 0.6; break;
      case 'press':   this.pressT = 0; break;
      case 'drum':    this.drumVel += 9; this.flash.drum = 0.15; this.dust(194, 90, 4); break;
      case 'sheet':   this.sheetVel += 11; this.flash.sheet = 0.1; break;
      case 'whistle': this.whistleT = 1.1; this.pressure = Math.max(0.05, this.pressure - 0.15); break;
      case 'welder':  this.weldT = 0.7; break;

        for (let i = 0; i < n; i++) this.spawnQueue.push({ at: this.t + i * 0.06, kind: 'bolt' });

  setRotation(on, speed = 1) { this.rotationOn = on; this.gearSpeed = on ? speed * 2.6 : 0; }
  setDrone(on) { this.droneOn = on; }
  setConveyor(on, speed = 1) { this.beltOn = on; this.beltSpeed = on ? speed : 0; }
  vent(strength = 1) {
    this.ventOpen = 1;

    const n = Math.round(14 * strength);
    for (let i = 0; i < n; i++) this.spawnQueue.push({ at: this.t + i * 0.025, kind: 'steam', big: true });

  /* ---------- particles ---------- */
  puff(big, x = 116, y = 29, scale = 1) {
    const spread = big ? 1.2 : 0.4;
    this.parts.push({
      type: 'steam',
      x: x + (Math.random() * 4 - 2), y,
      vx: ((Math.random() - 0.5) * spread * 18 + (big ? 10 : 4)) * scale,
      vy: (-(big ? 13 : 7) - Math.random() * 7) * scale,
      life: 0, max: (big ? 1.5 + Math.random() * 0.9 : 1.8 + Math.random() * 0.7) * (0.6 + 0.4 * scale),
      grow: (big ? 7 : 4) * scale,

  }
  sparks(x, y, n, white = false, down = false) {
    for (let i = 0; i < n; i++) {
      this.parts.push({
        type: 'spark', white, x, y,
        vx: (Math.random() - 0.5) * 70,
        vy: down ? Math.random() * 40 + 10 : -Math.random() * 60 - 10,
        life: 0, max: 0.35 + Math.random() * 0.4,
      });
    }
  }
  dust(x, y, n) {
    for (let i = 0; i < n; i++) {
      this.parts.push({
        type: 'dust', x: x + (Math.random() - 0.5) * 10, y,
        vx: (Math.random() - 0.5) * 30, vy: -Math.random() * 25 - 5,
        life: 0, max: 0.4 + Math.random() * 0.4,
      });
    }
  }
  bolt() {
    this.parts.push({
      type: 'bolt', x: 40 + Math.random() * 12, y: 55,
      vx: -20 - Math.random() * 30, vy: -10 - Math.random() * 10,
      bounces: 0, life: 0, max: 2.2,
    });
  }

  /* ---------- interaction ---------- */
  _click(e) {

  _update(dt) {
    while (this.spawnQueue.length && this.spawnQueue[0].at <= this.t) {

      if (s.kind === 'bolt') this.bolt();
      else this.puff(s.big);
    }
    this.idleTimer -= dt;
    if (this.idleTimer <= 0) {
      this.puff(false);
      if (Math.random() < 0.4) this.spawnQueue.push({ at: this.t + 0.15, kind: 'steam', big: false });
      this.idleTimer = 2.5 + Math.random() * 3;
      if (this.rotationOn || this.droneOn || this.beltOn) this.idleTimer *= 0.5;

    if (this.whistleT > 0) {
      this.whistleT -= dt;
      this.whistleTimer -= dt;

    }

    if (this.weldT > 0) {

      if (Math.random() < 0.3) this.sparks(145, 38, 1, true, true);

    if (this.pressT >= 0) {

  /* ---------- drawing ---------- */
  _draw() {
    const g = this.g, W = this.W, H = this.H;
    g.save();

    g.fillStyle = '#171a21'; g.fillRect(0, 0, W, H);
    g.fillStyle = '#1d212a';

    }
    // window
    g.fillStyle = '#232a36'; g.fillRect(182, 14, 22, 14);
    g.fillStyle = '#2c3545'; g.fillRect(184, 16, 18, 10);
    g.fillStyle = '#1d212a'; g.fillRect(192, 14, 2, 14); g.fillRect(182, 21, 22, 1);
    // welding light on the wall

    }

    let ox = 0, oy = 0;
    if (this.shake > 0) { ox = Math.round((Math.random() - 0.5) * 3); oy = Math.round((Math.random() - 0.5) * 3); }
    const vib = this.droneLevel > 0.3 ? Math.round(Math.sin(this.t * 40) * 0.6 * this.droneLevel) : 0;
    g.translate(ox, oy);

    g.fillStyle = '#3a3f49'; g.fillRect(-4, 0, W + 8, 5);
    g.fillStyle = '#4c5159'; g.fillRect(-4, 1, W + 8, 1);
    g.fillStyle = '#2a2e36'; for (let x = 2; x < W; x += 10) g.fillRect(x, 2, 2, 2);

    // floor
    g.fillStyle = '#2a2e36'; g.fillRect(-4, this.FLOOR, W + 8, H);
    g.fillStyle = '#3a3f49'; g.fillRect(-4, this.FLOOR, W + 8, 1);
    g.fillStyle = '#20242b';
    for (let x = 0; x < W; x += 16) g.fillRect(x + 4, this.FLOOR + 6, 8, 1);
    g.fillStyle = '#23272f'; g.fillRect(-4, 111, W + 8, 1);

    this._drawRail(g);
    this._drawChain(g);
    this._drawSheet(g);
    this._drawWelder(g);
    this._drawPress(g, vib);
    this._drawMachine(g, vib);
    this._drawWhistle(g);
    this._drawVent(g);
    this._drawPipe(g);
    this._drawGears(g);
    this._drawAnvil(g);
    this._drawStone(g);
    this._drawDrum(g);
    this._drawConveyor(g);
    this._drawParticles(g);
    if (this.weldT > 0) {
      g.fillStyle = Math.random() < 0.6 ? '#ffffff' : '#9fd0ff';
      g.fillRect(144, 37, 3, 2); g.fillRect(145, 36, 1, 4);
    }

  }

  _drawRail(g) {
    g.fillStyle = '#4c5159'; g.fillRect(20, 23, 47, 2); g.fillRect(20, 23, 2, 8); g.fillRect(65, 23, 2, 8);
    g.fillStyle = '#3a3f49'; g.fillRect(20, 5, 2, 18); g.fillRect(65, 5, 2, 18);
    // bell
    const bx = 31, by = 26, sw = Math.round(this.bellSwing * 1.5);
    g.fillStyle = '#6b6f78'; g.fillRect(bx, 25, 1, 3);
    g.fillStyle = '#c9a23a';
    g.fillRect(bx - 1 + sw, by + 2, 3, 2); g.fillRect(bx - 2 + sw, by + 4, 5, 3); g.fillRect(bx - 3 + sw, by + 7, 7, 3);
    g.fillStyle = '#8f7020'; g.fillRect(bx - 3 + sw, by + 10, 7, 1);
    g.fillStyle = '#f0d070'; g.fillRect(bx - 1 + sw, by + 4, 1, 4);
    g.fillStyle = '#333'; g.fillRect(bx + Math.round(this.bellSwing * 3), by + 11, 1, 1);
    // cowbell
    const cx = 46, cy = 26, cs = Math.round(this.cowSwing * 1.5);
    g.fillStyle = '#6b6f78'; g.fillRect(cx, 25, 1, 2);
    g.fillStyle = '#5f6670';
    g.fillRect(cx - 1 + cs, cy + 1, 3, 2); g.fillRect(cx - 2 + cs, cy + 3, 5, 4); g.fillRect(cx - 3 + cs, cy + 7, 7, 4);
    g.fillStyle = '#8a929c'; g.fillRect(cx - 1 + cs, cy + 3, 1, 7);
    g.fillStyle = '#2d3138'; g.fillRect(cx - 3 + cs, cy + 11, 7, 1);
    // cymbal
    const mx = 59, my = 30;
    g.fillStyle = '#6b6f78'; g.fillRect(mx, 25, 1, 5);
    const tilt = this.cymTilt, bright = this.flash.cym > 0;
    g.fillStyle = bright ? '#ffe9a0' : '#d2a83c';
    for (let i = -5; i <= 5; i++) {
      const yy = my + Math.round(tilt * i * 0.25);
      g.fillRect(mx + i, yy, 1, 1);
      if (Math.abs(i) < 3) g.fillRect(mx + i, yy + 1, 1, 1);
    }
    g.fillStyle = bright ? '#fff8d0' : '#f0cc6a'; g.fillRect(mx, my, 1, 1);
  }

  _drawChain(g) {
    const x0 = 76;
    const links = 17;
    for (let i = 0; i < links; i++) {
      const depth = i / links;
      const dx = Math.round(this.chainSwing * depth * 2.2 + (this.chainJitter > 0 ? (Math.random() - 0.5) * this.chainJitter * 2 : 0));
      const y = 5 + i * 2;
      g.fillStyle = i % 2 ? '#7a828e' : '#4c5159';
      if (i % 2) g.fillRect(x0 + dx, y, 2, 2); else g.fillRect(x0 - 1 + dx, y, 4, 2);
    }
    const dx = Math.round(this.chainSwing * 2.2);
    g.fillStyle = '#8a929c'; g.fillRect(x0 - 1 + dx, 39, 4, 1); g.fillRect(x0 - 2 + dx, 40, 2, 3); g.fillRect(x0 - 1 + dx, 43, 3, 1);
  }

  _drawSheet(g) {
    g.fillStyle = '#3a3f49'; g.fillRect(158, 5, 1, 6); g.fillRect(176, 5, 1, 6);
    const lit = this.flash.sheet > 0;
    for (let row = 0; row < 24; row++) {
      const dx = Math.round(Math.sin(row * 0.6 + this.t * 30) * this.sheetWob * 0.4);
      g.fillStyle = lit ? '#b8c2cf' : (row % 6 === 0 ? '#5e6570' : '#6a717c');
      g.fillRect(154 + dx, 10 + row, 26, 1);
      if (row === 0 || row === 23) { g.fillStyle = lit ? '#e0e8f0' : '#8a929c'; g.fillRect(154 + dx, 10 + row, 26, 1); }
    }
    g.fillStyle = '#2f333a';
    [[157, 13], [177, 13], [157, 30], [177, 30]].forEach(([x, y]) => g.fillRect(x, y, 1, 1));
  }

  _drawWelder(g) {
    g.fillStyle = '#4c5159'; g.fillRect(146, 5, 3, 23);
    g.fillStyle = '#6a717c'; g.fillRect(146, 5, 1, 23);
    g.fillStyle = '#3a3f49'; g.fillRect(144, 28, 7, 4);
    g.fillStyle = '#a03030'; g.fillRect(146, 29, 3, 2);
    g.fillStyle = '#5e6570'; g.fillRect(145, 32, 2, 5);
    g.fillStyle = '#b08040'; g.fillRect(145, 36, 1, 2);
  }

  _drawPress(g, vib) {
    // housing
    g.fillStyle = '#3f444d'; g.fillRect(38, 58 + vib, 16, 32);
    g.fillStyle = '#585e68'; g.fillRect(38, 58 + vib, 16, 2); g.fillRect(38, 58 + vib, 2, 32); g.fillRect(52, 58 + vib, 2, 32);
    g.fillStyle = '#20242a'; g.fillRect(41, 62 + vib, 10, 26);
    // hydraulic cylinder on top + bolt tray
    g.fillStyle = '#4c5159'; g.fillRect(43, 52, 6, 6);
    g.fillStyle = '#6a717c'; g.fillRect(43, 52, 6, 1);
    g.fillStyle = '#2f333a'; g.fillRect(36, 55, 7, 3); g.fillRect(49, 55, 7, 3);
    g.fillStyle = '#8a929c'; g.fillRect(37, 55, 2, 1); g.fillRect(40, 55, 2, 1); g.fillRect(51, 55, 2, 1); g.fillRect(54, 55, 1, 1);
    // piston head position
    let ph = 66 + Math.round((Math.sin(this.pistonPhase) + 1) * 6);
    if (this.pressT >= 0) {
      const p = this.pressT;
      if (p < 0.26) ph = 63 - Math.round(p * 8);
      else if (p < 0.3) ph = 63 + Math.round((p - 0.26) / 0.04 * 21);
      else if (p < 0.6) ph = 84;
      else ph = 84 - Math.round((p - 0.6) / 0.5 * 18);
    }
    g.fillStyle = this.flash.press > 0 ? '#e8ecf2' : '#8a929c'; g.fillRect(41, ph, 10, 4);
    g.fillStyle = '#c4ccd6'; g.fillRect(41, ph, 10, 1);
    g.fillStyle = '#6b737d'; g.fillRect(45, 62 + vib, 2, Math.max(0, ph - 62 - vib));
    // die plate at the bottom
    g.fillStyle = '#5e6570'; g.fillRect(41, 86, 10, 2);
    // connector pipe to machine
    g.fillStyle = '#4c5159'; g.fillRect(54, 68 + vib, 6, 4);
    g.fillStyle = '#626873'; g.fillRect(54, 68 + vib, 6, 1);
    g.fillStyle = '#8a9098';
    [[39, 59], [52, 59], [39, 88], [52, 88]].forEach(([x, y]) => g.fillRect(x, y + vib, 1, 1));
  }

  _drawMachine(g, vib) {
    const y0 = 48 + vib;
    g.fillStyle = '#545a63'; g.fillRect(60, y0, 68, 42);
    g.fillStyle = '#727a85'; g.fillRect(60, y0, 68, 2);
    g.fillStyle = '#3b4048'; g.fillRect(60, y0 + 40, 68, 2); g.fillRect(126, y0, 2, 42);
    g.fillStyle = this.flash.panel > 0 ? '#5e6570' : '#3d424a';
    g.fillRect(66, y0 + 10, 56, 26);
    g.fillStyle = '#2a2e35'; g.fillRect(66, y0 + 10, 56, 1); g.fillRect(66, y0 + 10, 1, 26);
    g.fillStyle = '#8f96a0';
    for (let x = 62; x < 128; x += 8) { g.fillRect(x, y0 + 4, 1, 1); g.fillRect(x, y0 + 38, 1, 1); }
    for (let y = y0 + 4; y < y0 + 40; y += 8) { g.fillRect(62, y, 1, 1); g.fillRect(124, y, 1, 1); }
    // gauge
    const gx = 78, gy = y0 + 22;
    g.fillStyle = '#20242a'; g.fillRect(gx - 8, gy - 8, 17, 17);
    g.fillStyle = '#d9d2b4'; g.fillRect(gx - 7, gy - 7, 15, 15);
    g.fillStyle = '#c33'; g.fillRect(gx + 3, gy - 6, 4, 2); g.fillRect(gx + 5, gy - 4, 2, 3);
    g.fillStyle = '#444';
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI * 0.85 + i * Math.PI * 0.425;
      g.fillRect(gx + Math.round(Math.cos(a) * 5.5), gy + Math.round(Math.sin(a) * 5.5), 1, 1);
    }
    const na = -Math.PI * 0.85 + this.pressure * Math.PI * 1.7 + (this.shake > 0 ? (Math.random() - 0.5) * 0.4 : 0);
    g.fillStyle = '#a02020';
    for (let r = 0; r < 6; r++) g.fillRect(gx + Math.round(Math.cos(na) * r), gy + Math.round(Math.sin(na) * r), 1, 1);
    g.fillStyle = '#222'; g.fillRect(gx, gy, 1, 1);
    // lamps
    const lamp = this.droneLevel * (0.6 + 0.4 * Math.sin(this.t * 2.4));
    g.fillStyle = '#20242a'; g.fillRect(93, y0 + 13, 5, 5);
    g.fillStyle = lamp > 0.3 ? (lamp > 0.7 ? '#ff5a2e' : '#c8381a') : '#4a1c12';
    g.fillRect(94, y0 + 14, 3, 3);
    if (lamp > 0.7) { g.fillStyle = '#ffb090'; g.fillRect(95, y0 + 15, 1, 1); }
    g.fillStyle = '#20242a'; g.fillRect(101, y0 + 13, 5, 5);
    g.fillStyle = this.rotationOn ? (Math.sin(this.t * 6) > 0 ? '#5cff7a' : '#2fa04a') : '#123818';
    g.fillRect(102, y0 + 14, 3, 3);
    ['#c9a23a', '#3a7bd5', '#c9a23a', '#a03030'].forEach((c, i) => {
      g.fillStyle = '#20242a'; g.fillRect(94 + i * 6, y0 + 24, 4, 4);
      g.fillStyle = c; g.fillRect(95 + i * 6, y0 + 25, 2, 2);
    });
    g.fillStyle = '#2a2e35';
    for (let i = 0; i < 4; i++) g.fillRect(112, y0 + 14 + i * 3, 8, 1);
    g.fillStyle = '#8b8f96'; g.fillRect(70, y0 + 33, 20, 2);
    g.fillStyle = '#c9a23a'; g.fillRect(70, y0 + 33, 4, 2); g.fillRect(78, y0 + 33, 4, 2); g.fillRect(86, y0 + 33, 4, 2);
  }

  _drawWhistle(g) {
    const hot = this.whistleT > 0;
    g.fillStyle = '#8f7020'; g.fillRect(65, 40, 5, 8);
    g.fillStyle = hot ? '#ffe090' : '#c9a23a'; g.fillRect(65, 40, 2, 8);
    g.fillStyle = '#6b5418'; g.fillRect(64, 38, 7, 2);
    g.fillStyle = hot ? '#fff4c0' : '#e0c060'; g.fillRect(64, 38, 7, 1);
    g.fillStyle = '#4c5159'; g.fillRect(66, 36, 3, 2);
  }

  _drawVent(g) {
    g.fillStyle = '#4a4f58'; g.fillRect(112, 32, 8, 17);
    g.fillStyle = '#6a717c'; g.fillRect(112, 32, 2, 17);
    g.fillStyle = '#33373e'; g.fillRect(118, 32, 2, 17);
    g.fillStyle = '#5e6570'; g.fillRect(111, 36, 10, 2); g.fillRect(111, 44, 10, 2);
    g.fillStyle = '#5e6570'; g.fillRect(110, 29, 12, 3);
    g.fillStyle = '#7a828e'; g.fillRect(110, 29, 12, 1);
    const open = Math.round(this.ventOpen * 3);
    g.fillStyle = '#8a929c'; g.fillRect(112, 28 - open, 8, 1);
    if (open > 0) { g.fillStyle = '#5e6570'; g.fillRect(112, 28 - open, 1, open); g.fillRect(119, 28 - open, 1, open); }
    if (this.pressure > 0.7) {
      g.fillStyle = this.pressure > 0.9 ? '#ff7a3a' : '#a04a2a';
      g.fillRect(114, 28 - open, 4, 1);
    }
  }

  _drawPipe(g) {
    const lit = this.flash.pipe > 0;
    g.fillStyle = lit ? '#8f9aa8' : '#4c5159'; g.fillRect(128, 39, 84, 6);
    g.fillStyle = lit ? '#c8d2de' : '#6a717c'; g.fillRect(128, 39, 84, 1);
    g.fillStyle = lit ? '#5b6573' : '#2f333a'; g.fillRect(128, 44, 84, 1);
    g.fillStyle = lit ? '#b0bac6' : '#5e6570';
    [128, 144, 166, 190].forEach(x => g.fillRect(x, 38, 3, 8));
    g.fillStyle = '#4c5159'; g.fillRect(128, 39, 4, 10);
    g.fillStyle = '#a03030'; g.fillRect(155, 35, 5, 1); g.fillRect(157, 33, 1, 5); g.fillRect(156, 34, 3, 3);
    g.fillStyle = '#5e6570'; g.fillRect(157, 36, 1, 3);
  }

  _drawGears(g) {
    g.fillStyle = '#3b4048'; g.fillRect(132, 84, 6, 6); g.fillRect(132, 62, 4, 28);
    g.fillStyle = '#2a2521'; g.fillRect(128, 65, 12, 1); g.fillRect(128, 87, 12, 1);
    this._gear(g, 150, 76, 11, 8, this.gearAngle, '#7a6a4c', '#5a4c34');
    this._gear(g, 167, 89, 6, 6, -this.gearAngle * (11 / 6) + 0.3, '#6e6350', '#4c4436');
    g.fillStyle = '#9a8a60'; g.fillRect(150, 76, 1, 1); g.fillRect(167, 89, 1, 1);
  }
  _gear(g, cx, cy, r, teeth, angle, col, dark) {
    g.fillStyle = col;
    g.beginPath(); g.arc(cx + 0.5, cy + 0.5, r - 1.5, 0, Math.PI * 2); g.fill();
    g.fillStyle = dark;
    for (let i = 0; i < teeth; i++) {
      const a = angle + (i / teeth) * Math.PI * 2;
      g.fillRect(Math.round(cx + Math.cos(a) * (r - 1)) - 1, Math.round(cy + Math.sin(a) * (r - 1)) - 1, 3, 3);
    }
    g.beginPath(); g.arc(cx + 0.5, cy + 0.5, Math.max(1.5, r * 0.35), 0, Math.PI * 2); g.fill();
    g.fillStyle = '#3a3128';
    for (let i = 0; i < 4; i++) {
      const a = angle + (i / 4) * Math.PI * 2;
      for (let rr = 2; rr < r - 3; rr++) g.fillRect(Math.round(cx + Math.cos(a) * rr), Math.round(cy + Math.sin(a) * rr), 1, 1);
    }
  }

  _drawAnvil(g) {
    const lit = this.flash.anvil > 0;
    g.fillStyle = lit ? '#e6ecf4' : '#5e6570';
    g.fillRect(2, 79, 16, 3); g.fillRect(0, 80, 3, 2);
    g.fillStyle = lit ? '#ffffff' : '#8a929c'; g.fillRect(2, 79, 16, 1);
    g.fillStyle = '#4c5159'; g.fillRect(6, 82, 8, 5);
    g.fillStyle = '#3b4048'; g.fillRect(4, 87, 12, 3);
    g.fillStyle = '#5a4838'; g.fillRect(3, 89, 14, 1);
  }

  _drawStone(g) {
    const j = Math.round(this.stoneJump * 2);
    g.fillStyle = '#6f7368'; g.fillRect(24, 84 - j, 10, 6); g.fillRect(26, 82 - j, 6, 2);
    g.fillStyle = '#8d9184'; g.fillRect(26, 82 - j, 4, 1); g.fillRect(25, 84 - j, 2, 1);
    g.fillStyle = '#4e514a'; g.fillRect(24, 88 - j, 10, 2); g.fillRect(30, 85 - j, 3, 1);
    g.fillStyle = '#6b4a2a'; g.fillRect(35, 76, 1, 14);
    g.fillStyle = '#7d848f'; g.fillRect(33, 74, 5, 3);
  }

  _drawDrum(g) {
    const tilt = Math.round(this.drumTilt * 1.2);
    const lit = this.flash.drum > 0;
    const x = 186, y = 68;
    for (let row = 0; row < 22; row++) {
      const dx = Math.round(tilt * (1 - row / 22));
      const rib = row === 6 || row === 15;
      g.fillStyle = rib ? '#3f444d' : (lit && row < 10 ? '#b56a3a' : '#8a4a2a');
      g.fillRect(x + dx, y + row, 16, 1);
      g.fillStyle = rib ? '#5e6570' : (lit && row < 10 ? '#d08a55' : '#a85e38');
      g.fillRect(x + 2 + dx, y + row, 3, 1);
      g.fillStyle = '#5a2e18'; g.fillRect(x + 13 + dx, y + row, 3, 1);
    }
    g.fillStyle = '#5e6570'; g.fillRect(x + tilt, y, 16, 2);
    g.fillStyle = '#8a929c'; g.fillRect(x + tilt, y, 16, 1);
    g.fillStyle = '#c9a23a'; g.fillRect(x + 6 + tilt, y + 9, 4, 4);
    g.fillStyle = '#2f333a'; g.fillRect(x + 7 + tilt, y + 10, 2, 2);
  }

  _drawConveyor(g) {
    const y = 98;
    // legs
    g.fillStyle = '#2f333a'; [50, 100, 150, 190].forEach(x => g.fillRect(x, y + 8, 2, 8));
    // belt body
    g.fillStyle = '#1b1d22'; g.fillRect(30, y, 172, 8);
    g.fillStyle = '#3a3128'; g.fillRect(30, y + 1, 172, 1); g.fillRect(30, y + 6, 172, 1);
    // moving tread marks
    g.fillStyle = '#4a4034';
    const off = Math.floor(this.beltOffset) % 8;
    for (let x = 30 + off; x < 200; x += 8) g.fillRect(x, y + 1, 3, 1);
    for (let x = 30 + ((8 - off) % 8); x < 200; x += 8) g.fillRect(x, y + 6, 3, 1);
    // rollers
    [[34, y + 4], [198, y + 4]].forEach(([cx, cy]) => {
      g.fillStyle = '#5e6570'; g.beginPath(); g.arc(cx + 0.5, cy + 0.5, 4.5, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#8a929c';
      const a = this.beltOffset * 0.25;
      g.fillRect(Math.round(cx + Math.cos(a) * 2), Math.round(cy + Math.sin(a) * 2), 1, 1);
      g.fillRect(Math.round(cx - Math.cos(a) * 2), Math.round(cy - Math.sin(a) * 2), 1, 1);
    });
    // motor
    g.fillStyle = '#3f444d'; g.fillRect(18, y - 2, 12, 12);
    g.fillStyle = '#585e68'; g.fillRect(18, y - 2, 12, 1);
    g.fillStyle = this.beltOn ? (Math.sin(this.t * 8) > 0 ? '#5cff7a' : '#2fa04a') : '#123818';
    g.fillRect(21, y + 1, 2, 2);
    g.fillStyle = '#2a2e35'; for (let i = 0; i < 3; i++) g.fillRect(20, y + 5 + i * 2, 8, 1);
    // items riding the belt
    const items = [
      { w: 6, h: 5, draw: (x, yy) => { g.fillStyle = '#8a6a3a'; g.fillRect(x, yy, 6, 5); g.fillStyle = '#b08a4a'; g.fillRect(x, yy, 6, 1); g.fillStyle = '#5a4020'; g.fillRect(x + 2, yy + 1, 2, 4); } },
      { w: 6, h: 3, draw: (x, yy) => { g.fillStyle = '#c9a23a'; g.fillRect(x, yy, 6, 3); g.fillStyle = '#f0d070'; g.fillRect(x + 1, yy, 4, 1); } },
      { w: 5, h: 5, draw: (x, yy) => { g.fillStyle = '#7a6a4c'; g.fillRect(x + 1, yy, 3, 5); g.fillRect(x, yy + 1, 5, 3); g.fillStyle = '#3a3128'; g.fillRect(x + 2, yy + 2, 1, 1); } },
      { w: 4, h: 6, draw: (x, yy) => { g.fillStyle = '#8a4a2a'; g.fillRect(x, yy, 4, 6); g.fillStyle = '#a85e38'; g.fillRect(x + 1, yy, 1, 6); g.fillStyle = '#5e6570'; g.fillRect(x, yy, 4, 1); } },
      { w: 7, h: 3, draw: (x, yy) => { g.fillStyle = '#6a717c'; g.fillRect(x, yy, 7, 3); g.fillStyle = '#8a929c'; g.fillRect(x, yy, 7, 1); g.fillStyle = '#2f333a'; g.fillRect(x + 1, yy + 1, 1, 1); g.fillRect(x + 5, yy + 1, 1, 1); } },
    ];
    const span = 160, gap = 36;
    for (let i = 0; i < 5; i++) {
      const it = items[i];
      const px = 36 + ((i * gap + this.beltOffset) % span);
      if (px + it.w > 200) continue;
      it.draw(Math.round(px), y - it.h);
    }
  }

  _drawParticles(g) {
    const steamPal = ['#ffffff', '#e4e8ee', '#c1c7d1', '#98a0ab', '#6d747f'];
    for (const p of this.parts) {
      const a = p.life / p.max;
      if (p.type === 'steam') {
        const s = Math.max(1, Math.round(1 + a * p.grow));
        g.fillStyle = steamPal[Math.min(steamPal.length - 1, Math.floor(a * steamPal.length))];
        const x0 = Math.round(p.x - s / 2), y0 = Math.round(p.y - s / 2);
        const dither = a > 0.55;
        for (let yy = 0; yy < s; yy++) {
          for (let xx = 0; xx < s; xx++) {
            const dx = xx - (s - 1) / 2, dy = yy - (s - 1) / 2;
            if (dx * dx + dy * dy > (s / 2) * (s / 2) + 0.5) continue;
            if (dither && ((xx + yy + Math.floor(p.y)) & 1)) continue;
            g.fillRect(x0 + xx, y0 + yy, 1, 1);
          }
        }
      } else if (p.type === 'spark') {
        g.fillStyle = p.white ? (a < 0.5 ? '#fff' : '#bcd') : (a < 0.3 ? '#fff4c0' : a < 0.7 ? '#ffb030' : '#c04a10');
        g.fillRect(Math.round(p.x), Math.round(p.y), 1, 1);
      } else if (p.type === 'bolt') {
        if (a > 0.75 && Math.floor(this.t * 12) % 2) continue;   // blink out
        g.fillStyle = '#9aa2ac'; g.fillRect(Math.round(p.x), Math.round(p.y), 2, 1);
        g.fillStyle = '#5e6570'; g.fillRect(Math.round(p.x), Math.round(p.y) + 1, 1, 1);
      } else {
        g.fillStyle = a < 0.5 ? '#9a9a90' : '#5f6058';
        g.fillRect(Math.round(p.x), Math.round(p.y), 1, 1);
      }
    }
  }
}

/* ============================================================
   App: wires synth + pixel machine + pads + loops + keyboard +
   sequencer + live recording + saving + i18n together.
   ============================================================ */
(() => {
  const $ = s => document.querySelector(s);

  /* ---------- sound registry ---------- */
  const PADS = [
    { id: 'stone',   key: '1', color: '#9aa08c', fn: Synth.stone },

    { id: 'impact',  key: '3', color: '#e8792b', fn: Synth.impact },

    { id: 'cymbal',  key: '5', color: '#f0d890', fn: Synth.cymbal },
    { id: 'cowbell', key: '6', color: '#9fb3c8', fn: Synth.cowbell },
    { id: 'steam',   key: '7', color: '#cfd6e0', fn: Synth.steam },
