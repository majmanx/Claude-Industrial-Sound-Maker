<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>工业声音生成器</title>
  <meta name="description" content="用 Web Audio 合成的工业声音生成器：敲石头、敲管道、机器撞击、铃铛、镲、牛铃、铁砧、铁链、冲压机、油桶、铁皮板、汽笛、电焊、螺栓，附机器喷气像素动画。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">⚙</span>
      <div>
        <h1 data-i18n="title">工业声音生成器</h1>
        <p class="sub" data-i18n="subtitle">全部声音由 WEB AUDIO 实时合成</p>
      </div>
    </div>
    <div class="master">
      <label class="lang-wrap"><span data-i18n="language">语言</span>
        <select id="lang" class="px"></select>
      </label>
      <label><span data-i18n="masterVol">总音量</span> <input id="masterVol" type="range" min="0" max="1" step="0.01" value="0.8"></label>
      <label><span data-i18n="reverb">车间混响</span> <input id="reverbWet" type="range" min="0" max="0.8" step="0.01" value="0.28"></label>
      <button id="recBtn" class="btn px rec-btn" data-i18n="record">● 录制</button>
      <button id="panic" class="btn px danger" data-i18n="stopAll">全部停止</button>
    </div>
  </header>

  <main class="layout">
    <section class="panel px machine-panel">
      <div class="panel-head">
        <h2 data-i18n="machine">机器</h2>
        <span class="hint" data-i18n="hintCanvas">点击画面里的部件也能触发</span>
      </div>
      <div class="canvas-wrap px">
        <canvas id="pixel" width="208" height="117"></canvas>
        <div id="startOverlay" class="overlay">
          <button id="startBtn" class="btn px big" data-i18n="start">▶ 启动机器</button>
          <p data-i18n="startHint">浏览器需要一次点击才能开启音频</p>
        </div>
      </div>
      <div class="loops" id="loops"></div>
    </section>

    <section class="panel px pads-panel">
      <div class="panel-head">
        <h2 data-i18n="hits">敲击</h2>
        <span class="hint" data-i18n="hintKeys">键盘 1–7 Q–I 触发 · 8 9 0 切换机器 · 空格 播放/停止</span>
      </div>
      <div class="pads" id="pads"></div>
    </section>

    <section class="panel px seq-panel">
      <div class="panel-head">
        <h2 data-i18n="sequencer">音序器</h2>
        <div class="seq-controls">
          <button id="seqPlay" class="btn px accent" data-i18n="play">▶ 播放</button>
          <label><span data-i18n="bpm">BPM</span> <input id="bpm" class="px" type="number" min="50" max="220" value="124"> <input id="bpmRange" type="range" min="50" max="220" value="124"></label>
          <button id="seqRandom" class="btn px" data-i18n="random">随机</button>
          <button id="seqClear" class="btn px" data-i18n="clear">清空</button>
        </div>
      </div>
      <div class="seq-grid" id="seqGrid"></div>
    </section>
  </main>

  <footer class="foot">
    <p data-i18n="footer">无采样文件 · 所有音色均为参数化合成，每次敲击略有随机变化。「录制」会记录你演奏的一切，停止后即可下载。</p>
  </footer>
  <div id="toast" class="toast px" role="status" aria-live="polite"></div>

  <script src="js/i18n.js"></script>
  <script src="js/synth.js"></script>
  <script src="js/pixel.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
